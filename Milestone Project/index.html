<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>Bookshelf</title>
  <link ref="stylesheet" href="main.css">
  <style>
    body {
      margin: 0;
      background: #f4f1ea;
    }

    main {
      padding: 2rem;
    }

      /* Navbar styles */
    .navbar {
      background-color: #333; /* Dark background */
      padding: 10px 20px;
      
    }

    .nav-list {
      list-style-type: none; /* Remove bullet points */
      display: flex; /* Make it horizontal */
      gap: 20px; /* Space between links */
      margin: 0;
      padding: 0;
    }

    .nav-list li a {
      color: white; /* Text color */
      text-decoration: none; /* Remove underline */
      font-weight: bold;
      font-size: 18px;
      transition: color 0.3s ease;
    }

    .nav-list li a:hover {
      color: #888787; /* Color when hovering */
    }

    section {
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid #ccc;
      padding-bottom: 0.5rem;
    }

    article {
      display: inline-block;
      width: 150px;
      margin: 1rem;
      background:#ddd;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
      text-align: center;
      transition: transform 0.2s ease;
    }

    article:hover {
      transform: scale(1.05);
    }

    figure {
      margin: 0;
    }

    img {
      width: 100%;
      height: 100px;
      object-fit: contain;
      border-radius: 5px;
    }

    figcaption {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      text-decoration: none;
      color: black;
      font-weight: bold;
    }

    section header {
      margin-bottom: 1rem;
    }

    section {
      background: #adadad;
      border: 8px solid #464646;
      border-radius: 8px;
      padding: 1rem;
    }
    a{
      text-decoration: none;
    }
  </style>
<!--start of the code-->
</head>
