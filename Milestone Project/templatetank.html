<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Georgia, serif;
      margin: 0;
      background: #f4f1ea;
    }
    main {
      padding: 2rem;
    }
    section {
        background: #adadad;
        border: 8px solid #464646;
        border-radius: 8px;
        padding: 1rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid #ccc;
      padding-bottom: 0.5rem;
    }
    /* Basic Reset */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

/* Grid container */
    .grid-container {
        display: grid;
        grid-template-columns: 1fr 2fr; /* 1x2 grid, 1 part for image, 2 parts for text */
        gap: 20px; /* Space between image and text */
        align-items: center; /* Vertically centers content */
        padding: 20px;
    }

/* Image styles */
    .grid-container .image img {
        width: 100%; /* Makes image responsive */
        max-width: 300px; /* Optional: Sets a max width */
        height: auto; /* Maintain aspect ratio */
    }

/* Text styles */
    .grid-container .text {
        font-family: Arial, sans-serif;
        line-height: 1.5;
    }

/* Optional: Make it more responsive for smaller screens */
    @media (max-width: 768px) {
        .grid-container {
            grid-template-columns: 1fr; /* Stacks the image and text vertically on small screens */
        }
    }

    </style>
</head>
<body>
    <main>
        <section>
            <h1>title</h1>
            <div class="grid-container">
                <div class="image">
                    <img src="https://via.placeholder.com/300" alt="Placeholder Image">
                </div>
                <div class="text">
                    <h2>testing this</h2>
                </div>
            </div>

        </section>
        
    </main>
</body>
</head>
